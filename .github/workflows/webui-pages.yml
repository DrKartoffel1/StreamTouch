name: WebUI checks and GitHub Pages
on:
  push:
    branches: [main]
    paths: ['webui/**', 'docs/**', '.github/workflows/webui-pages.yml']
  pull_request:
    paths: ['webui/**', 'docs/**', '.github/workflows/webui-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: webui/test-results
      - run: npm run build:pages
      - name: Verify committed Pages files are current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- ../docs)" ]; then
            echo "::error::Run npm run build:pages in webui and commit docs/ with the source changes."
            git status --short --untracked-files=all -- ../docs
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
